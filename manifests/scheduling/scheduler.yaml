# A second kube-scheduler, running beside the cluster's default one, with two
# profiles that differ ONLY in how NodeResourcesFit scores nodes:
#
#   spread-scheduler   LeastAllocated -- prefers the emptiest node that fits
#   binpack-scheduler  MostAllocated  -- prefers the fullest node that fits
#
# A pod opts in with `spec.schedulerName`; every other pod in the cluster stays on
# the default scheduler, which this does not touch. That is why this is a
# Deployment rather than a reconfiguration of the built-in scheduler: k3s only
# accepts scheduler config at cluster creation, so changing the default would
# mean rebuilding the cluster.
#
# The image version must match the cluster's Kubernetes version (v1.35.5).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-scheduler
  namespace: kube-system
---
# The two built-in roles every kube-scheduler runs with: binding pods to nodes,
# and reading storage objects for volume-aware placement.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lab-scheduler-as-kube-scheduler
subjects:
  - kind: ServiceAccount
    name: lab-scheduler
    namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:kube-scheduler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lab-scheduler-as-volume-scheduler
subjects:
  - kind: ServiceAccount
    name: lab-scheduler
    namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:volume-scheduler
---
# Lets the scheduler's own HTTPS endpoint (used by its health probe) authenticate
# callers the same way the API server does.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-scheduler-auth-reader
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: lab-scheduler
    namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-scheduler-config
  namespace: kube-system
data:
  config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    # One replica, so no leader election. Leaving it on would need a lease the
    # built-in system:kube-scheduler role only grants under the default
    # scheduler's own name.
    leaderElection:
      leaderElect: false
    profiles:
      # Both profiles switch off the same three score plugins, so the only
      # difference between them is the scoring strategy:
      #   NodeResourcesBalancedAllocation -- favours even CPU/memory ratios,
      #                                      a spreading pressure of its own
      #   PodTopologySpread               -- by default spreads a Deployment's
      #                                      replicas across nodes regardless
      #   ImageLocality                   -- favours nodes that already have the
      #                                      image, which could tip a placement
      # Left on, any of these could produce a "spread" result the strategy
      # under test did not cause.
      - schedulerName: spread-scheduler
        plugins:
          score:
            disabled:
              - name: NodeResourcesBalancedAllocation
              - name: PodTopologySpread
              - name: ImageLocality
        pluginConfig:
          - name: NodeResourcesFit
            args:
              scoringStrategy:
                type: LeastAllocated
                # fake-gpu is weighted above CPU and memory so that the
                # resource the demo counts is the one that decides placement,
                # not the unequal background load each node already carries.
                resources:
                  - name: cpu
                    weight: 1
                  - name: memory
                    weight: 1
                  - name: example.com/fake-gpu
                    weight: 5
      - schedulerName: binpack-scheduler
        plugins:
          score:
            disabled:
              - name: NodeResourcesBalancedAllocation
              - name: PodTopologySpread
              - name: ImageLocality
        pluginConfig:
          - name: NodeResourcesFit
            args:
              scoringStrategy:
                type: MostAllocated
                resources:
                  - name: cpu
                    weight: 1
                  - name: memory
                    weight: 1
                  - name: example.com/fake-gpu
                    weight: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-scheduler
  namespace: kube-system
  labels:
    app: lab-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab-scheduler
  template:
    metadata:
      labels:
        app: lab-scheduler
    spec:
      serviceAccountName: lab-scheduler
      containers:
        - name: kube-scheduler
          image: registry.k8s.io/kube-scheduler:v1.35.5
          command:
            - /usr/local/bin/kube-scheduler
            - --config=/etc/lab-scheduler/config.yaml
            - --v=2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 10259
              scheme: HTTPS
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 10259
              scheme: HTTPS
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config
              mountPath: /etc/lab-scheduler
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: lab-scheduler-config
