apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
  namespace: default
  annotations:
    serving.kserve.io/s3-endpoint: minio.kserve-lab.svc.cluster.local:9000
    serving.kserve.io/s3-usehttps: "0"
    serving.kserve.io/s3-verifyssl: "0"
    serving.kserve.io/s3-region: us-east-1
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin123
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kserve-s3-sa
  namespace: default
secrets:
  - name: s3-credentials
