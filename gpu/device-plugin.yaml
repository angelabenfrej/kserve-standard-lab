# NVIDIA device plugin: advertises GPUs to the kubelet so that
# `nvidia.com/gpu` becomes a schedulable resource. Without this DaemonSet the
# nodes report no GPU capacity and no pod can request one, regardless of
# whether the node container can physically see the card.
#
# It runs under the `nvidia` RuntimeClass itself, since it needs the NVIDIA
# libraries injected in order to enumerate the devices.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
    spec:
      runtimeClassName: nvidia
      priorityClassName: system-node-critical
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: nvidia-device-plugin-ctr
          image: nvcr.io/nvidia/k8s-device-plugin:v0.17.4
          env:
            # Keep the DaemonSet from crash-looping on nodes with no GPU.
            - name: FAIL_ON_INIT_ERROR
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
